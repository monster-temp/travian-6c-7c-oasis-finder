name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.0.22
      - run: bun install
      - run: bun run check
      - run: bun run build
      - name: Verify committed browser bundle
        run: git diff --exit-code -- build/main.js
